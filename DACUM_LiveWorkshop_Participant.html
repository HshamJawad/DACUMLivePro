<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DACUM Live Pro - Participant Voting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            font-size: 1.5em;
            margin: 20px 0 15px 0;
        }

        .info-box {
            background: #dbeafe;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #3b82f6;
        }

        .info-box h3 {
            color: #1e40af;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #1e3a8a;
            line-height: 1.6;
        }

        .duty-section {
            background: #f9fafb;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            overflow-x: auto;
        }

        .duty-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
        }

        .task-table {
            width: 100%;
            min-width: 800px;
            margin-top: 15px;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .task-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .task-table th {
            color: white;
            font-weight: 600;
            padding: 12px 10px;
            text-align: center;
            font-size: 0.85em;
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        .task-table th:first-child {
            text-align: left;
            padding-left: 15px;
        }

        .task-table th:last-child {
            border-right: none;
        }

        .task-table tbody tr {
            border-bottom: 1px solid #e5e7eb;
            transition: background-color 0.2s;
        }

        .task-table tbody tr:hover {
            background-color: #f9fafb;
        }

        .task-table tbody tr:last-child {
            border-bottom: none;
        }

        .task-table td {
            padding: 15px 10px;
            vertical-align: middle;
            border-right: 1px solid #e5e7eb;
        }

        .task-table td:last-child {
            border-right: none;
        }

        .task-cell {
            text-align: left;
            font-size: 0.95em;
            color: #374151;
            font-weight: 500;
            padding-left: 15px !important;
        }

        .rating-cell {
            text-align: center;
            padding: 10px 5px !important;
        }

        .rating-column {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .rating-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .rating-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
        }

        .rating-option label {
            font-size: 0.9em;
            font-weight: 600;
            color: #667eea;
            cursor: pointer;
            margin: 0;
            min-width: 12px;
        }

        .score-cell {
            text-align: center;
            font-weight: 700;
            font-size: 1.1em;
            color: #667eea;
        }

        .status-cell {
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .status-incomplete {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-complete {
            background: #d1fae5;
            color: #065f46;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .task-table {
                font-size: 0.85em;
            }

            .task-table th,
            .task-table td {
                padding: 8px 5px;
            }

            .task-cell {
                font-size: 0.85em;
                padding-left: 10px !important;
            }

            .rating-option {
                gap: 4px;
            }

            .rating-option input[type="radio"] {
                width: 16px;
                height: 16px;
            }

            .rating-option label {
                font-size: 0.85em;
            }
        }

        button {
            cursor: pointer;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1em;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 30px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 12px;
            display: none;
            z-index: 1000;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .status.success {
            background: #d1fae5;
            border-left: 4px solid #10b981;
            color: #065f46;
            display: block;
        }

        .status.error {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            display: block;
        }

        /* Language switcher — three pills, one tap, active language
           always visible. Sized for a thumb on a phone. */
        #ptLangWrap {
            display: flex; justify-content: center; gap: 4px;
            margin: 0 auto 14px; padding: 3px; width: fit-content;
            background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 99px;
        }
        .pt-lang-btn {
            border: none; background: transparent; color: #64748b;
            font: 600 0.8em/1 inherit; letter-spacing: 0.03em;
            padding: 8px 14px; min-width: 44px; border-radius: 99px; cursor: pointer;
        }
        .pt-lang-btn.is-active { background: #fff; color: #4f46e5; box-shadow: 0 1px 3px rgba(0,0,0,.1); }

        /* RTL: mirror the layout, never the 0-3 scale. The rating
           columns read as an ordinal axis and a participant calling out
           numbers in a live room must not meet a reversed one. */
        /* This page is standalone — it loads no stylesheet from the
           app, so the @font-face in dacum-rtl.css never reaches it.
           Without this block the Arabic voting screen asked for Cairo
           and silently got a system fallback on every device.

           font-display: swap matters more here than anywhere else:
           participants open this on their own phones, on conference
           wifi, in the minute a facilitator is waiting to start. */
        @font-face {
            font-family: 'Cairo';
            src: url('fonts/Cairo.woff2') format('woff2-variations'),
                 url('fonts/Cairo.woff2') format('woff2');
            font-weight: 200 1000;
            font-style: normal;
            font-display: swap;
        }

        body.pt-rtl { direction: rtl; font-family: 'Cairo','Tajawal','Segoe UI',Tahoma,sans-serif; }
        body.pt-rtl .task-table { direction: rtl; }
        body.pt-rtl .task-cell { text-align: right; }
        body.pt-rtl .rating-column, body.pt-rtl .rating-cell { direction: ltr; }
        body.pt-rtl .info-box { text-align: right; }

        /* Supplementary Occupational Verification — card list rather
           than a wide table, so it reads well on a phone. */
        .sv-section { background:#f5f3ff; padding:20px; margin:30px 0 20px; border-radius:12px; border-left:4px solid #8b5cf6; }
        body.pt-rtl .sv-section { border-left:none; border-right:4px solid #8b5cf6; }
        .sv-section h2 { color:#5b21b6; margin:0 0 6px; font-size:1.3em; }
        .sv-intro { color:#4c1d95; font-size:.92em; line-height:1.6; margin-bottom:14px; }
        .sv-cat-title { font-weight:700; color:#6d28d9; margin:18px 0 8px; font-size:1.05em; }
        .sv-item { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
                   background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:10px 14px; margin-bottom:8px; }
        .sv-item-text { flex:1 1 220px; color:#374151; font-weight:500; font-size:.95em; }
        .sv-item .rating-column { direction:ltr; flex:0 0 auto; }
        .sv-item.sv-done { border-color:#a7f3d0; background:#f0fdf4; }
        .sv-scale-hint { font-size:.8em; color:#6b7280; margin-bottom:6px; }

        .loading {
            text-align: center;
            padding: 50px;
            color: #667eea;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 DACUM Live Pro</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px;" data-pt="subtitle">Participant Voting</p>

        <div id="ptLangWrap" role="group" aria-label="Language">
            <button type="button" class="pt-lang-btn" data-lang="en" onclick="setParticipantLang('en')">EN</button>
            <button type="button" class="pt-lang-btn" data-lang="fr" onclick="setParticipantLang('fr')">FR</button>
            <button type="button" class="pt-lang-btn" data-lang="ar" onclick="setParticipantLang('ar')">AR</button>
        </div>

        <div id="loadingSection" class="loading">
            <p data-pt="loading">Loading voting session…</p>
        </div>

        <div id="votingSection" style="display: none;">
            <div class="info-box">
                <h3>📋 <span data-pt="occupation">Occupation:</span> <span id="occupationTitle"></span></h3>
                <p><strong data-pt="jobTitle">Job Title:</strong> <span id="jobTitle"></span></p>
                <p style="margin-top: 10px;" data-pt="instructions">Rate each task on three dimensions (0-3). Your votes will be aggregated with other participants to determine training priorities.</p>
            </div>

            <div id="votingContainer">
                <!-- Voting tasks will be displayed here -->
            </div>

            <button class="btn-success" onclick="submitVotes()" id="btnSubmitVotes">
                <span data-pt="submit">✅ Submit All Votes</span>
            </button>
        </div>
    </div>

    <div id="statusMessage" class="status"></div>


    <script>
    /* ── Self-contained i18n ─────────────────────────────────────────
       Deliberately NOT loading translations.js. This page opens from a
       QR code on a participant's phone, frequently on strained
       conference wifi, and often as the only page of the app that
       device will ever fetch. A failed dictionary request here means a
       room full of people who cannot vote. Twenty strings inline
       always work.

       Language arrives in the link (&lang=ar) so participants need no
       setup; the switcher is there for anyone who wants otherwise. */
    const PT = {
      en: {
        subtitle: 'Participant Voting',
        loading: 'Loading voting session\u2026',
        occupation: 'Occupation:',
        jobTitle: 'Job Title:',
        instructions: 'Rate each task on three dimensions (0-3). Your votes will be aggregated with other participants to determine training priorities.',

        thDifficulty: 'Difficulty', thScore: 'Task Score', thStatus: 'Status',

        closedBody: 'Voting has been closed by the facilitator.',
        closedThanks: 'Thank you for your participation!',
        errNoSession: 'No session ID provided. Please use the link provided by your facilitator.',

        errLoading: 'Error loading session: {msg}',

        errIncomplete: 'Please complete all three ratings for at least one task',
        okSubmitted: '\u2705 Votes submitted successfully! Thank you for participating.',
        svTitle: 'Supplementary Occupational Verification',
        svIntro: 'Rate how important each item is for this occupation (0 = not important, 3 = critical). These ratings are kept separate from task priorities.',

      },
      fr: {
        subtitle: 'Vote des participants',
        loading: 'Chargement de la session\u2026',
        occupation: 'M\u00e9tier :',
        jobTitle: 'Titre du poste :',
        instructions: '\u00c9valuez chaque t\u00e2che sur trois dimensions (0-3). Vos votes seront agr\u00e9g\u00e9s avec ceux des autres participants pour d\u00e9terminer les priorit\u00e9s de formation.',
        submit: '\u2705 Envoyer tous les votes',
        thTask: 'T\u00e2che', thImportance: 'Importance', thFrequency: 'Fr\u00e9quence',
        thDifficulty: 'Difficult\u00e9', thScore: 'Score', thStatus: 'Statut',
        scaleImp: '(0=Nulle, 3=Critique)', scaleFreq: '(0=Rare, 3=Quotidien)', scaleDiff: '(0=Facile, 3=Tr\u00e8s)',

        closedTitle: '\u{1F512} Session de vote cl\u00f4tur\u00e9e',
        closedBody: 'Le vote a \u00e9t\u00e9 cl\u00f4tur\u00e9 par l\u2019animateur.',
        closedThanks: 'Merci de votre participation !',
        errNoSession: 'Aucun identifiant de session. Utilisez le lien fourni par votre animateur.',
        errLoadFailed: '\u00c9chec du chargement. V\u00e9rifiez votre lien.',
        errLoading: 'Erreur de chargement : {msg}',
        errClosed: 'Le vote a \u00e9t\u00e9 cl\u00f4tur\u00e9 par l\u2019animateur.',
        errIncomplete: 'Compl\u00e9tez les trois \u00e9valuations pour au moins une t\u00e2che',
        okSubmitted: '\u2705 Votes envoy\u00e9s. Merci de votre participation !',
        svTitle: 'V\u00e9rification professionnelle compl\u00e9mentaire',
        svIntro: '\u00c9valuez l\u2019importance de chaque \u00e9l\u00e9ment pour ce m\u00e9tier (0 = pas important, 3 = critique). Ces notes restent distinctes des priorit\u00e9s des t\u00e2ches.',
        errSubmit: 'Erreur lors de l\u2019envoi : {msg}'
      },
      ar: {
        subtitle: '\u062a\u0635\u0648\u064a\u062a \u0627\u0644\u0645\u0634\u0627\u0631\u0643\u064a\u0646',
        loading: '\u062c\u0627\u0631\u064d \u062a\u062d\u0645\u064a\u0644 \u062c\u0644\u0633\u0629 \u0627\u0644\u062a\u0635\u0648\u064a\u062a\u2026',
        occupation: '\u0627\u0644\u0645\u0647\u0646\u0629:',
        jobTitle: '\u0627\u0633\u0645 \u0627\u0644\u0639\u0645\u0644:',
        instructions: '\u0642\u064a\u0651\u0645 \u0643\u0644 \u0645\u0647\u0645\u0629 \u0639\u0644\u0649 \u062b\u0644\u0627\u062b\u0629 \u0623\u0628\u0639\u0627\u062f (0-3). \u0648\u0633\u062a\u064f\u062c\u0645\u0651\u0639 \u0623\u0635\u0648\u0627\u062a\u0643 \u0645\u0639 \u0628\u0642\u064a\u0629 \u0627\u0644\u0645\u0634\u0627\u0631\u0643\u064a\u0646 \u0644\u062a\u062d\u062f\u064a\u062f \u0623\u0648\u0644\u0648\u064a\u0627\u062a \u0627\u0644\u062a\u062f\u0631\u064a\u0628.',
        submit: '\u2705 \u0625\u0631\u0633\u0627\u0644 \u062c\u0645\u064a\u0639 \u0627\u0644\u0623\u0635\u0648\u0627\u062a',
        thTask: '\u0627\u0644\u0645\u0647\u0645\u0629', thImportance: '\u0627\u0644\u0623\u0647\u0645\u064a\u0629', thFrequency: '\u0627\u0644\u062a\u0643\u0631\u0627\u0631',
        thDifficulty: '\u0627\u0644\u0635\u0639\u0648\u0628\u0629', thScore: '\u062f\u0631\u062c\u0629 \u0627\u0644\u0645\u0647\u0645\u0629', thStatus: '\u0627\u0644\u062d\u0627\u0644\u0629',
        scaleImp: '(0=\u063a\u064a\u0631 \u0645\u0647\u0645\u0629\u060c 3=\u062d\u0631\u062c\u0629)',
        scaleFreq: '(0=\u0646\u0627\u062f\u0631\u0627\u064b\u060c 3=\u064a\u0648\u0645\u064a\u0627\u064b)',
        scaleDiff: '(0=\u0633\u0647\u0644\u0629\u060c 3=\u0635\u0639\u0628\u0629 \u062c\u062f\u0627\u064b)',
        complete: '\u0645\u0643\u062a\u0645\u0644\u0629', incomplete: '\u063a\u064a\u0631 \u0645\u0643\u062a\u0645\u0644\u0629',
        closedTitle: '\u{1F512} \u0623\u064f\u063a\u0644\u0642\u062a \u062c\u0644\u0633\u0629 \u0627\u0644\u062a\u0635\u0648\u064a\u062a',
        closedBody: '\u0623\u063a\u0644\u0642 \u0627\u0644\u0645\u064f\u064a\u0633\u0651\u0631 \u0628\u0627\u0628 \u0627\u0644\u062a\u0635\u0648\u064a\u062a.',
        closedThanks: '\u0634\u0643\u0631\u0627\u064b \u0644\u0645\u0634\u0627\u0631\u0643\u062a\u0643!',
        errNoSession: '\u0644\u0645 \u064a\u064f\u0642\u062f\u0651\u0645 \u0645\u0639\u0631\u0651\u0641 \u0627\u0644\u062c\u0644\u0633\u0629. \u0627\u0633\u062a\u062e\u062f\u0645 \u0627\u0644\u0631\u0627\u0628\u0637 \u0627\u0644\u0630\u064a \u0632\u0648\u0651\u062f\u0643 \u0628\u0647 \u0627\u0644\u0645\u064f\u064a\u0633\u0651\u0631.',
        errLoadFailed: '\u062a\u0639\u0630\u0651\u0631 \u062a\u062d\u0645\u064a\u0644 \u062c\u0644\u0633\u0629 \u0627\u0644\u062a\u0635\u0648\u064a\u062a. \u062a\u062d\u0642\u0651\u0642 \u0645\u0646 \u0627\u0644\u0631\u0627\u0628\u0637.',
        errLoading: '\u062e\u0637\u0623 \u0641\u064a \u062a\u062d\u0645\u064a\u0644 \u0627\u0644\u062c\u0644\u0633\u0629: {msg}',
        errClosed: '\u0623\u063a\u0644\u0642 \u0627\u0644\u0645\u064f\u064a\u0633\u0651\u0631 \u0628\u0627\u0628 \u0627\u0644\u062a\u0635\u0648\u064a\u062a.',
        errIncomplete: '\u0623\u0643\u0645\u0650\u0644 \u0627\u0644\u062a\u0642\u064a\u064a\u0645\u0627\u062a \u0627\u0644\u062b\u0644\u0627\u062b\u0629 \u0644\u0645\u0647\u0645\u0629 \u0648\u0627\u062d\u062f\u0629 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644',
        svTitle: '\u0627\u0644\u062a\u062d\u0642\u0642 \u0645\u0646 \u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0627\u062a \u0627\u0644\u0645\u0647\u0646\u064a\u0629 \u0627\u0644\u0625\u0636\u0627\u0641\u064a\u0629',
        svIntro: '\u0642\u064a\u0651\u0645 \u0623\u0647\u0645\u064a\u0629 \u0643\u0644 \u0628\u0646\u062f \u0644\u0647\u0630\u0647 \u0627\u0644\u0645\u0647\u0646\u0629 (0 = \u063a\u064a\u0631 \u0645\u0647\u0645\u060c 3 = \u062d\u0631\u062c). \u062a\u0628\u0642\u0649 \u0647\u0630\u0647 \u0627\u0644\u062a\u0642\u064a\u064a\u0645\u0627\u062a \u0645\u0646\u0641\u0635\u0644\u0629 \u0639\u0646 \u0623\u0648\u0644\u0648\u064a\u0627\u062a \u0627\u0644\u0645\u0647\u0627\u0645.',
        okSubmitted: '\u2705 \u0623\u064f\u0631\u0633\u0644\u062a \u0627\u0644\u0623\u0635\u0648\u0627\u062a \u0628\u0646\u062c\u0627\u062d! \u0634\u0643\u0631\u0627\u064b \u0644\u0645\u0634\u0627\u0631\u0643\u062a\u0643.',
        errSubmit: '\u062e\u0637\u0623 \u0641\u064a \u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u0623\u0635\u0648\u0627\u062a: {msg}'
      }
    };

    let PLANG = 'en';

    function pt(k, vars) {
      let v = (PT[PLANG] && PT[PLANG][k] !== undefined) ? PT[PLANG][k] : PT.en[k];
      if (v === undefined) return k;
      if (vars) for (const n in vars) v = v.split('{' + n + '}').join(vars[n]);
      return v;
    }

    function setParticipantLang(code) {
      PLANG = PT[code] ? code : 'en';
      localStorage.setItem('dacum_pt_lang', PLANG);
      const rtl = (PLANG === 'ar');
      document.documentElement.lang = PLANG;
      document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
      document.body.classList.toggle('pt-rtl', rtl);

      document.querySelectorAll('[data-pt]').forEach(el => {
        el.textContent = pt(el.getAttribute('data-pt'));
      });
      document.querySelectorAll('.pt-lang-btn').forEach(b => {
        b.classList.toggle('is-active', b.getAttribute('data-lang') === PLANG);
      });

      /* The voting table is generated, so it has to be rebuilt. Votes
         live in participantVotes, not in the DOM, so nothing a
         participant has already selected is lost — the radios are
         re-checked from that object below. */
      if (typeof sessionData !== 'undefined' && sessionData &&
          document.getElementById('votingSection').style.display !== 'none') {
        renderVotingInterface(sessionData);
        restoreVotes();
      }
    }

    /* Re-tick the radios and recompute each row after a rebuild. */
    function restoreVotes() {
      Object.keys(participantVotes || {}).forEach(taskId => {
        const v = participantVotes[taskId] || {};
        ['importance', 'frequency', 'difficulty'].forEach(dim => {
          if (v[dim] === undefined) return;
          const el = document.querySelector(
            `input[name="${taskId}_${dim}"][value="${v[dim]}"]`);
          if (el) el.checked = true;
        });
        if (typeof updateTaskDisplay === 'function') updateTaskDisplay(taskId);
      });
      Object.keys(supplementaryVotes || {}).forEach(itemId => {
        const el = document.querySelector(
          `input[name="sv_${itemId}"][value="${supplementaryVotes[itemId]}"]`);
        if (el) el.checked = true;
        const row = document.getElementById('sv_row_' + itemId);
        if (row) row.classList.add('sv-done');
      });
    }
    </script>

    <script>
        // Backend API endpoint
        const API_BASE = 'https://live-session-backend-production.up.railway.app/api';
        
        // Participant voting data
        let participantVotes = {};
        // Supplementary Occupational Verification: { itemId: 0-3 }.
        // Only used when the session carries a `supplementary` block.
        let supplementaryVotes = {};
        let sessionId = null;
        let sessionData = null;
        
        // Show status message
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            setTimeout(() => {
                statusEl.className = 'status';
            }, 5000);
        }
        
        // Load session data
        async function loadSession(sessionId) {
            try {
                const response = await fetch(`${API_BASE}/get-session/${sessionId}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    sessionData = result.data;
                    
                    // Check localStorage flag first
                    if (localStorage.getItem('dacumVotingClosed_' + sessionId) === 'true') {
                        document.getElementById('loadingSection').style.display = 'none';
                        document.getElementById('votingSection').innerHTML = `
                            <div style="text-align: center; padding: 40px; background: #fee2e2; border-radius: 12px; border: 2px solid #ef4444;">
                                <h2 style="color: #991b1b; margin-bottom: 15px;">${pt('closedTitle')}</h2>
                                <p style="color: #7f1d1d; font-size: 1.1em;">${pt('closedBody')}</p>
                                <p style="color: #7f1d1d; margin-top: 15px;">${pt('closedThanks')}</p>
                            </div>
                        `;
                        document.getElementById('votingSection').style.display = 'block';
                        return;
                    }
                    
                    // Check if session is closed
                    if (sessionData.closed) {
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('votingSection').innerHTML = `
                    <div style="text-align: center; padding: 40px; background: #fee2e2; border-radius: 12px; border: 2px solid #ef4444;">
                        <h2 style="color: #991b1b; margin-bottom: 15px;">${pt('closedTitle')}</h2>
                        <p style="color: #7f1d1d; font-size: 1.1em;">${pt('closedBody')}</p>
                        <p style="color: #7f1d1d; margin-top: 15px;">${pt('closedThanks')}</p>
                    </div>
                `;
                document.getElementById('votingSection').style.display = 'block';
                return;
            }
            
                    renderVotingInterface(sessionData);
                    document.getElementById('loadingSection').style.display = 'none';
                    document.getElementById('votingSection').style.display = 'block';
                } else {
                    throw new Error(result.error || 'Failed to load session');
                }
                
            } catch (error) {
                console.error('Error loading session:', error);
                showStatus(pt('errLoading', { msg: error.message }), 'error');
                document.getElementById('loadingSection').innerHTML = `<p style="color: #ef4444;">${pt('errLoadFailed')}</p>`;
            }
        }
        
        // Render voting interface
        function renderVotingInterface(sessionData) {
            document.getElementById('occupationTitle').textContent = sessionData.occupation;
            document.getElementById('jobTitle').textContent = sessionData.jobTitle;
            
            const container = document.getElementById('votingContainer');
            container.innerHTML = '';
            
            let taskCounter = 1;
            
            Object.keys(sessionData.duties).forEach(dutyId => {
                const duty = sessionData.duties[dutyId];
                
                const dutySection = document.createElement('div');
                dutySection.className = 'duty-section';
                
                let html = `<div class="duty-title">${escapeHtml(duty.title)}</div>`;
                
                html += `
                    <table class="task-table">
                        <thead>
                            <tr>
                                <th style="width: 35%;">${pt('thTask')}</th>
                                <th style="width: 13%;">${pt('thImportance')}<br><span style="font-size: 0.75em; font-weight: 400;">${pt('scaleImp')}</span></th>
                                <th style="width: 13%;">${pt('thFrequency')}<br><span style="font-size: 0.75em; font-weight: 400;">${pt('scaleFreq')}</span></th>
                                <th style="width: 13%;">${pt('thDifficulty')}<br><span style="font-size: 0.75em; font-weight: 400;">${pt('scaleDiff')}</span></th>
                                <th style="width: 13%;">${pt('thScore')}</th>
                                <th style="width: 13%;">${pt('thStatus')}</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                duty.tasks.forEach(task => {
                    html += `
                        <tr id="task_row_${task.id}">
                            <td class="task-cell">${taskCounter}. ${escapeHtml(task.text)}</td>
                            
                            <td class="rating-cell">
                                <div class="rating-column">
                                    ${[0, 1, 2, 3].map(val => `
                                        <div class="rating-option">
                                            <input type="radio" 
                                                   id="${task.id}_imp_${val}"
                                                   name="${task.id}_importance" 
                                                   value="${val}"
                                                   onchange="recordVote('${task.id}', 'importance', ${val})">
                                            <label for="${task.id}_imp_${val}">${val}</label>
                                        </div>
                                    `).join('')}
                                </div>
                            </td>
                            
                            <td class="rating-cell">
                                <div class="rating-column">
                                    ${[0, 1, 2, 3].map(val => `
                                        <div class="rating-option">
                                            <input type="radio" 
                                                   id="${task.id}_freq_${val}"
                                                   name="${task.id}_frequency" 
                                                   value="${val}"
                                                   onchange="recordVote('${task.id}', 'frequency', ${val})">
                                            <label for="${task.id}_freq_${val}">${val}</label>
                                        </div>
                                    `).join('')}
                                </div>
                            </td>
                            
                            <td class="rating-cell">
                                <div class="rating-column">
                                    ${[0, 1, 2, 3].map(val => `
                                        <div class="rating-option">
                                            <input type="radio" 
                                                   id="${task.id}_diff_${val}"
                                                   name="${task.id}_difficulty" 
                                                   value="${val}"
                                                   onchange="recordVote('${task.id}', 'difficulty', ${val})">
                                            <label for="${task.id}_diff_${val}">${val}</label>
                                        </div>
                                    `).join('')}
                                </div>
                            </td>
                            
                            <td class="score-cell" id="score_${task.id}">—</td>
                            
                            <td class="status-cell">
                                <span class="status-badge status-incomplete" id="status_${task.id}">${pt('incomplete')}</span>
                            </td>
                        </tr>
                    `;
                    taskCounter++;
                });
                
                html += `
                        </tbody>
                    </table>
                `;
                
                dutySection.innerHTML = html;
                container.appendChild(dutySection);
            });

            renderSupplementary(sessionData, container);
        }

        /* Optional section — rendered ONLY when the facilitator enabled
           Supplementary Occupational Verification and it has items.
           Sessions without it (and every older session) show tasks only. */
        function renderSupplementary(sessionData, container) {
            const supp = sessionData && sessionData.supplementary;
            const cats = supp && Array.isArray(supp.categories)
                ? supp.categories.filter(c => c.items && c.items.length) : [];
            if (!cats.length) return;

            const sec = document.createElement('div');
            sec.className = 'sv-section';
            let html = `<h2>\u{1F9ED} ${pt('svTitle')}</h2>
                        <p class="sv-intro">${pt('svIntro')}</p>`;
            cats.forEach(cat => {
                html += `<div class="sv-cat-title">${escapeHtml(cat.name || '')}</div>`;
                cat.items.forEach(item => {
                    html += `<div class="sv-item" id="sv_row_${item.id}">
                        <div class="sv-item-text">${escapeHtml(item.text || '')}</div>
                        <div class="rating-column">
                            ${[0, 1, 2, 3].map(val => `
                                <div class="rating-option">
                                    <input type="radio" id="sv_${item.id}_${val}" name="sv_${item.id}" value="${val}"
                                           onchange="recordSupplementaryVote('${item.id}', ${val})">
                                    <label for="sv_${item.id}_${val}">${val}</label>
                                </div>`).join('')}
                        </div>
                    </div>`;
                });
            });
            sec.innerHTML = html;
            container.appendChild(sec);
        }

        function recordSupplementaryVote(itemId, value) {
            supplementaryVotes[itemId] = parseInt(value);
            const row = document.getElementById('sv_row_' + itemId);
            if (row) row.classList.add('sv-done');
        }
        
        // Record a vote
        function recordVote(taskId, dimension, value) {
            if (!participantVotes[taskId]) {
                participantVotes[taskId] = {};
            }
            participantVotes[taskId][dimension] = parseInt(value);
            
            // Update task score and status
            updateTaskDisplay(taskId);
        }
        
        // Update task score and status badge
        function updateTaskDisplay(taskId) {
            const vote = participantVotes[taskId];
            const scoreElement = document.getElementById('score_' + taskId);
            const statusElement = document.getElementById('status_' + taskId);
            
            if (!scoreElement || !statusElement) return;
            
            const hasImportance = vote && vote.importance !== undefined;
            const hasFrequency = vote && vote.frequency !== undefined;
            const hasDifficulty = vote && vote.difficulty !== undefined;
            
            if (hasImportance && hasFrequency && hasDifficulty) {
                // Calculate total score
                const totalScore = vote.importance + vote.frequency + vote.difficulty;
                scoreElement.textContent = totalScore;
                
                // Update status badge to complete
                statusElement.textContent = pt('complete');
                statusElement.className = 'status-badge status-complete';
            } else {
                // Incomplete
                scoreElement.textContent = '—';
                statusElement.textContent = pt('incomplete');
                statusElement.className = 'status-badge status-incomplete';
            }
        }
        
        // Submit all votes
        async function submitVotes() {
            // Check localStorage flag first
            if (localStorage.getItem('dacumVotingClosed_' + sessionId) === 'true') {
                showStatus(pt('errClosed'), 'error');
                document.getElementById('btnSubmitVotes').disabled = true;
                return;
            }
            
            // Filter to only fully completed tasks
            const completedVotes = {};
            Object.keys(participantVotes).forEach(taskId => {
                const vote = participantVotes[taskId];
                if (vote.importance !== undefined && vote.frequency !== undefined && vote.difficulty !== undefined) {
                    completedVotes[taskId] = vote;
                }
            });
            
            // Validate that at least one task is fully rated
            if (Object.keys(completedVotes).length === 0) {
                showStatus(pt('errIncomplete'), 'error');
                return;
            }
            

            // Check if session is still open before submitting
            try {
                const checkResponse = await fetch(`${API_BASE}/get-session/${sessionId}`);
                const checkResult = await checkResponse.json();
                
                if (checkResult.success && checkResult.data.closed) {
                    showStatus(pt('errClosed'), 'error');
                    return;
                }
            } catch (error) {
                console.error('Error checking session status:', error);
            }
            
            // Submit only completed votes to backend
            try {
                const response = await fetch(`${API_BASE}/submit-vote`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(Object.assign(
                        { sessionId: sessionId, votes: completedVotes },
                        Object.keys(supplementaryVotes).length
                            ? { supplementaryVotes: supplementaryVotes } : {}
                    ))
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus(pt('okSubmitted'), 'success');
                    document.getElementById('btnSubmitVotes').disabled = true;
                    document.getElementById('votingContainer').style.opacity = '0.5';
                } else {
                    throw new Error(result.error || 'Failed to submit votes');
                }
                
            } catch (error) {
                console.error('Error submitting votes:', error);
                showStatus(pt('errSubmit', { msg: error.message }), 'error');
            }
        }
        
        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            sessionId = urlParams.get('lwsession');

            /* Precedence: an explicit choice this participant already
               made on this device wins, then the language the
               facilitator put in the link, then English. Storing their
               choice matters because a participant who switches to
               Arabic and later re-scans the QR code should not be
               dragged back to the facilitator's language. */
            setParticipantLang(
              localStorage.getItem('dacum_pt_lang') ||
              urlParams.get('lang') ||
              'en'
            );

            if (sessionId) {
                loadSession(sessionId);
            } else {
                document.getElementById('loadingSection').innerHTML = `<p style="color: #ef4444;">${pt('errNoSession')}</p>`;
            }
        });
    </script>
</body>
</html>
